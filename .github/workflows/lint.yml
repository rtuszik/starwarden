name: checks
on:
    pull_request:
    workflow_dispatch:

jobs:
    setup:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: "Set up Python"
              uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
              with:
                  python-version-file: "pyproject.toml"
            - name: Install uv
              uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
              with:
                  enable-cache: true
                  version: 0.11.*
            - name: Install dependencies
              run: uv sync --locked
            - name: Cache dependencies
              uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
              with:
                  path: |
                      .venv
                      ~/.cache/uv
                  key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}

    lint:
        runs-on: ubuntu-latest
        needs: setup
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: "Set up Python"
              uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
              with:
                  python-version-file: "pyproject.toml"
            - name: Install uv
              uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
              with:
                  enable-cache: true
                  version: 0.11.*
            - name: Restore dependencies
              uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
              with:
                  path: |
                      .venv
                      ~/.cache/uv
                  key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
                  fail-on-cache-miss: true
            - name: Run linting
              run: |
                  uv run ruff check 

    typecheck:
        runs-on: ubuntu-latest
        needs: setup
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: "Set up Python"
              uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
              with:
                  python-version-file: "pyproject.toml"
            - name: Install uv
              uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
              with:
                  enable-cache: true
                  version: 0.11.*
            - name: Restore dependencies
              uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
              with:
                  path: |
                      .venv
                      ~/.cache/uv
                  key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
                  fail-on-cache-miss: true
            - name: Run type checking
              run: uv run ty check
    vulture:
        runs-on: ubuntu-latest
        needs: setup
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: "Set up Python"
              uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
              with:
                  python-version-file: "pyproject.toml"
            - name: Install uv
              uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
              with:
                  enable-cache: true
                  version: 0.11.*
            - name: Restore dependencies
              uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
              with:
                  path: |
                      .venv
                      ~/.cache/uv
                  key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
                  fail-on-cache-miss: true
            - name: Run vulture
              run: uv run vulture .

