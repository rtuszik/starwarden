name: StarWarden Build

on:
    release:
        types: [published]
    workflow_dispatch:

env:
    DOCKER_IMAGE: rtuszik/starwarden

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

            - name: Login to Docker Hub
              uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}
            - name: Extract metadata (tags, labels) for Docker
              id: meta
              uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
              with:
                  images: ${{ env.DOCKER_IMAGE }}
                  tags: |
                      type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
                      type=semver,pattern={{version}},enable=${{ github.event_name == 'release' }}
                      type=semver,pattern={{major}}.{{minor}},enable=${{ github.event_name == 'release' }}
                      type=ref,event=branch
                      type=ref,event=pr
                      type=sha,prefix=sha-

            - name: Build and push
              id: docker_build
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
              with:
                  context: .
                  file: ./Dockerfile
                  push: ${{ github.event_name != 'pull_request' }}
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=registry,ref=${{ env.DOCKER_IMAGE }}:buildcache
                  cache-to: type=registry,ref=${{ env.DOCKER_IMAGE }}:buildcache,mode=max
                  platforms: linux/amd64,linux/arm64

            - name: Image digest
              run: echo ${{ steps.docker_build.outputs.digest }}
